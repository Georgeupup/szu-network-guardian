name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name SZU-Network-Guardian-v1.2.1
          main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SZU-Network-Guardian-Windows
          path: dist/SZU-Network-Guardian-v1.2.1.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "dist/SZU-Network-Guardian-v1.2.1.exe"
          --title "SZU Network Guardian ${{ github.ref_name }}"
          --generate-notes
